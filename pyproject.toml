[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fetal-brain-growth"
version = "0.1.0"
description = "Fetal MRI tissue segmentation, volumetry, and research growth charts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Anand A. Joshi", email = "ajoshi@usc.edu"}]
keywords = ["fetal MRI", "FetalSynthSeg", "FeTA", "volumetry", "growth charts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "matplotlib>=3.7",
  "nibabel>=5.2",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
segmentation = ["monai>=1.3", "torch>=2.1"]
notebook = ["ipykernel>=6", "jupyter>=1", "nbconvert>=7", "nbformat>=5"]
test = ["pytest>=8"]
all = [
  "monai>=1.3",
  "torch>=2.1",
  "ipykernel>=6",
  "jupyter>=1",
  "nbconvert>=7",
  "nbformat>=5",
  "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/ajoshiusc/fetal-brain-growth"
Repository = "https://github.com/ajoshiusc/fetal-brain-growth"
Issues = "https://github.com/ajoshiusc/fetal-brain-growth/issues"

[project.scripts]
fbg = "fetal_brain_growth.cli:main"
fbg-segment = "fetal_brain_growth.segmentation:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fetal_brain_growth = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
